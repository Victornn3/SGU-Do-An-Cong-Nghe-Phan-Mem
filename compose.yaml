name: van-mieu

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # [M11] ĐÃ ĐÓNG CỔNG 27017 RA NGOÀI ĐỂ ĐẢM BẢO AN TOÀN
    # (Nếu cần dùng MongoDB Compass để xem DB khi dev, chỉ mở nội bộ: - "127.0.0.1:27017:27017")
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: vm_auth
      JWT_SECRET: ${JWT_SECRET:-vanmieu_prod_secret_key_2026}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  poi-service:
    build:
      context: .
      dockerfile: services/poi-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: vm_poi
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  narration-service:
    build:
      context: .
      dockerfile: services/narration-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: vm_narration
      POI_SERVICE_URL: http://poi-service:8002
      AUDIO_BASE_DIR: /data/audio
    volumes:
      - ./data/audio:/data/audio
    depends_on:
      mongo:
        condition: service_healthy
      poi-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  ticket-service:
    build:
      context: .
      dockerfile: services/ticket-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: vm_ticket
      USER_WEB_BASE_URL: ${USER_WEB_BASE_URL:-http://localhost/index.html}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  statistics-service:
    build:
      context: .
      dockerfile: services/statistics-service/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: vm_stats
      TICKET_SERVICE_URL: http://ticket-service:8004
    depends_on:
      mongo:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-vanmieu_prod_secret_key_2026}
      AUTH_SERVICE_URL: http://auth-service:8001
      POI_SERVICE_URL: http://poi-service:8002
      NARRATION_SERVICE_URL: http://narration-service:8003
      TICKET_SERVICE_URL: http://ticket-service:8004
      STATISTICS_SERVICE_URL: http://statistics-service:8005
    depends_on:
      - auth-service
      - poi-service
      - narration-service
      - ticket-service
      - statistics-service

  seed-data:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017
      # Mỗi service một database riêng (database-per-service)
      MONGODB_DB_AUTH: vm_auth
      MONGODB_DB_POI: vm_poi
      MONGODB_DB_NARRATION: vm_narration
      MONGODB_DB_TICKET: vm_ticket
      SEED_DATA_DIR: /app/data/seed
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./data/seed:/app/data/seed:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./data/audio:/app-data/audio:ro
      - ./data/images:/app-data/images:ro
    depends_on:
      - api-gateway

volumes:
  mongo_data: