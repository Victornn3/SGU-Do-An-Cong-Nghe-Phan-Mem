server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Chống trình duyệt cache mã nguồn JS và CSS trong quá trình phát triển
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # API Gateway routing
    location /api/ {
        set $api_gateway http://api-gateway:8000;
        proxy_pass $api_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Phục vụ thư viện ảnh POI
    location /images/ {
        alias /app-data/images/;
        access_log on;
    }

    # Phục vụ file âm thanh đa ngôn ngữ MP3
    location /audio/ {
        alias /app-data/audio/;
        # Sửa thuyết minh sẽ ghi đè MP3 cùng tên: buộc trình duyệt kiểm tra lại, không phát bản cũ.
        add_header Cache-Control "no-cache";
        types {
            audio/mpeg mp3;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        access_log on;
    }

    # Định tuyến mặc định cho Frontend
    location / {
        try_files $uri $uri/ =404;
    }
}