name: CD

# CD chạy khi push lên main hoặc gắn tag phiên bản (v1.2.3), hoặc chạy tay.
# Luồng: CI (gọi lại ci.yml) -> publish 8 image lên GHCR -> deploy lên server qua SSH (tùy chọn).
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Triển khai lên server sau khi publish image"
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway,        dockerfile: api-gateway/Dockerfile }
          - { name: auth-service,       dockerfile: services/auth-service/Dockerfile }
          - { name: poi-service,        dockerfile: services/poi-service/Dockerfile }
          - { name: narration-service,  dockerfile: services/narration-service/Dockerfile }
          - { name: ticket-service,     dockerfile: services/ticket-service/Dockerfile }
          - { name: statistics-service, dockerfile: services/statistics-service/Dockerfile }
          - { name: frontend,           dockerfile: frontend/Dockerfile }
          - { name: seed-data,          dockerfile: scripts/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tên image (GHCR yêu cầu chữ thường)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vanmieu-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Cài Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build và push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Chỉ chạy khi đã bật biến repository DEPLOY_ENABLED=true (xem docs/ci-cd.md).
  deploy:
    name: Deploy lên server
    needs: publish
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/van-mieu' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || '*' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra cấu hình bắt buộc
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY JWT_SECRET ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Thiếu secret $v (xem docs/ci-cd.md)"
              exit 1
            fi
          done

      - name: Chuẩn bị SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::Chưa có secret DEPLOY_KNOWN_HOSTS, dùng ssh-keyscan (tin khóa host ở lần kết nối đầu)"
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Tạo file .env cho server
        run: |
          umask 077
          {
            printf "JWT_SECRET='%s'\n" "$JWT_SECRET"
            printf "ADMIN_PASSWORD='%s'\n" "$ADMIN_PASSWORD"
            printf "IMAGE_PREFIX=ghcr.io/%s/vanmieu\n" "${GITHUB_REPOSITORY_OWNER,,}"
            printf "IMAGE_TAG=sha-%s\n" "${GITHUB_SHA::7}"
            printf "USER_WEB_BASE_URL=%s\n" "${DEPLOY_URL:-http://localhost}/index.html"
            printf "ALLOWED_ORIGINS=%s\n" "$ALLOWED_ORIGINS"
          } > deploy.env

      - name: Đồng bộ file lên server
        run: |
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes)
          SCP=(scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$TARGET" "mkdir -p '$DEPLOY_PATH/data/audio'"
          # data/seed và data/images nằm trong git; data/audio sinh trên server nên không ghi đè
          tar czf - data/seed data/images | "${SSH[@]}" "$TARGET" "tar xzf - -C '$DEPLOY_PATH'"
          "${SCP[@]}" compose.prod.yaml "$TARGET:$DEPLOY_PATH/compose.yaml"
          "${SCP[@]}" deploy.env "$TARGET:$DEPLOY_PATH/.env"

      # Thứ tự quan trọng: pull (kể cả image seed) -> seed lần đầu -> mới khởi động dịch vụ.
      # Nếu khởi động trước, auth-service tự tạo admin/admin123 và seed không còn đặt được ADMIN_PASSWORD.
      - name: Pull image, seed lần đầu rồi khởi động
        run: |
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          SSH=(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes)
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | "${SSH[@]}" "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          "${SSH[@]}" "$TARGET" "cd '$DEPLOY_PATH' && docker compose --profile seed pull"
          "${SSH[@]}" "$TARGET" "cd '$DEPLOY_PATH' && if [ ! -f .seeded ]; then docker compose --profile seed run --rm seed-data && touch .seeded; else echo 'Đã seed trước đó, bỏ qua (xóa file .seeded để seed lại).'; fi"
          "${SSH[@]}" "$TARGET" "cd '$DEPLOY_PATH' && docker compose up -d --remove-orphans"
          "${SSH[@]}" "$TARGET" "docker logout ghcr.io"

      - name: Kiểm tra sau triển khai
        if: ${{ env.DEPLOY_URL != '' }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$DEPLOY_URL/api/languages" >/dev/null && curl -fsS "$DEPLOY_URL/api/pois" >/dev/null; then
              echo "Hệ thống phản hồi tại $DEPLOY_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Hệ thống không phản hồi sau khi deploy"
          exit 1

      - name: Dọn file tạm
        if: always()
        run: rm -f deploy.env ~/.ssh/deploy_key
