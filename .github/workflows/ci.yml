name: POI Service CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Cài đặt thư viện của service và pytest
          if [ -f services/poi-service/requirements.txt ]; then
            pip install -r services/poi-service/requirements.txt
          fi
          pip install pytest

      - name: Run Unit Tests with Pytest
        run: |
          cd services/poi-service
          # Chạy pytest để kiểm thử tự động toàn bộ logic (Geofence, tính khoảng cách,...)
          pytest -v

      - name: Build Docker Image
        run: |
          # Kiểm tra xem Dockerfile build thành công hay không
          docker build -t vanmieu-poi-service:latest -f services/poi-service/Dockerfile .