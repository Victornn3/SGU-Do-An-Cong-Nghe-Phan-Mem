name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f services/poi-service/requirements.txt ]; then
            pip install -r services/poi-service/requirements.txt
          fi

      - name: Check Python Syntax
        run: |
          # Kiểm tra trực tiếp lỗi cú pháp trên toàn bộ mã nguồn python của các service
          python -m py_compile services/poi-service/app/*.py
          python -m py_compile services/statistics-service/app/*.py
          python -m py_compile services/ticket-service/app/*.py
          python -m py_compile services/auth-service/app/*.py
          python -m py_compile services/narration-service/app/*.py
          python -m py_compile api-gateway/app/*.py

      - name: Build Docker Images
        run: |
          # Kiểm tra build thử các Dockerfile quan trọng xem có lỗi đường dẫn hay build context không
          docker build -t vanmieu-poi-service:latest -f services/poi-service/Dockerfile .
          docker build -t vanmieu-api-gateway:latest -f api-gateway/Dockerfile .