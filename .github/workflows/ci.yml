name: CI Pipeline - Van Mieu Microservices

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: kiem tra cac ham va logic rieng le.
  run-tests:
    name: Unit and Data Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js for Geofence tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bcrypt

      - name: Run unit and data tests
        run: pytest tests/ -v

  # Job 2: build images, start isolated services, then test real service-to-service flow.
  integration-tests:
    name: Docker Build and Integration Tests
    runs-on: ubuntu-latest
    needs: run-tests
    timeout-minutes: 25
    env:
      # Chi dung cho MongoDB tam thoi cua GitHub Actions, khong phai secret production.
      JWT_SECRET: ci-only-jwt-secret-change-for-real-deployment
      ADMIN_PASSWORD: ci-only-admin-password
      USER_WEB_BASE_URL: http://localhost/index.html
      INTEGRATION_BASE_URL: http://localhost
      INTEGRATION_ADMIN_USERNAME: admin
      INTEGRATION_ADMIN_PASSWORD: ci-only-admin-password
      RUN_INTEGRATION: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install integration test dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --parallel

      - name: Start MongoDB
        run: docker compose up -d mongo

      - name: Seed isolated CI database
        run: docker compose run --rm seed-data

      - name: Start application services
        run: |
          docker compose up -d \
            auth-service \
            poi-service \
            narration-service \
            ticket-service \
            statistics-service \
            api-gateway \
            frontend

      - name: Wait for public API through Nginx and Gateway
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost/api/languages >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($attempt/60)"
            sleep 5
          done
          echo "API did not become ready in 5 minutes"
          docker compose ps
          docker compose logs --no-color --tail=100
          exit 1

      - name: Run service integration tests
        run: pytest tests/integration/ -v

      - name: Run existing API smoke tests
        run: bash tests/smoke_api.sh http://localhost

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150

      - name: Stop containers and remove CI database volume
        if: always()
        run: docker compose down --volumes --remove-orphans
