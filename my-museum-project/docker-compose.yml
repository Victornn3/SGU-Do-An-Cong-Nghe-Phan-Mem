services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  auth_service:
    build: ./auth_service
    container_name: auth_container
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    restart: unless-stopped

  api_gateway:
    build: ./api_gateway
    container_name: gateway_container
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
    restart: unless-stopped

volumes:
  mongo_data: