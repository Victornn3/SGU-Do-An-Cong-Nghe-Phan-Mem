services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: unless-stopped

  auth_service:
    build: ./auth-service
    container_name: auth_container
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb
    restart: unless-stopped

  museum_service:
    build: ./museum_service
    container_name: museum_container
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  audio_service:
    build: ./audio-service
    container_name: audio_container
    ports:
      - "8003:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    volumes:
      - audio_media:/app/media
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  audio_worker:
    build: ./audio-service
    command: python -u worker.py
    container_name: worker_container
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    volumes:
      - audio_media:/app/media
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  api_gateway:
    build: ./api_gateway
    container_name: gateway_container
    ports:
      - "8000:8000"
    volumes:
      - audio_media:/app/media
      - ./frontend:/app/frontend
      - ./assets:/app/assets
    depends_on:
      - auth_service
      - museum_service
      - audio_service
    restart: unless-stopped

volumes:
  mongo_data:
  audio_media: